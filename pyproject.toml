[dependency-groups]
validators = ["roc-validator==0.11.4", "pyshacl==0.40.1", "rdflib==7.6.0", "lxml==6.1.3"]
dev = [{include-group = "validators"}, "pytest", "pytest-xdist", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["adapter/profile", "adapter/profile/must", "scripts"]
addopts = "-n auto"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["adapter/profile", "adapter/profile/must", "scripts", "tests/adapter_profile", "tests/compatibility"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"adapter/profile/must/*.py" = ["E402"]
