[dependency-groups]
validators = ["roc-validator==0.11.4", "pyshacl==0.40.1", "rdflib==7.6.0", "lxml==6.1.3", "jsonschema==4.25.1"]
dev = [{include-group = "validators"}, "pytest==9.1.1", "pytest-randomly==5.0.0", "pytest-xdist==3.8.0", "ruff==0.16.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["adapter/profile", "adapter/profile/must", "scripts", ".github/actions/rerun-when-edited", "bench/generate", "tests/bench"]
addopts = "-n auto --dist loadgroup"
junit_family = "xunit1"
markers = ["says(text): what a parametrized case shows, as its manifest says it; the tests page prints it as the case's description"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["tests", "adapter/profile", "adapter/profile/must", "scripts", ".github/actions/rerun-when-edited", "bench/generate", "tests/adapter_profile", "tests/bench", "tests/compatibility", "tests/explorer", "tests/specification"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"adapter/profile/must/*.py" = ["E402"]
