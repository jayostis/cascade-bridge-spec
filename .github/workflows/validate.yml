# This repository's own CI, and all of it. Everything docs/validation.md and
# CLAUDE.md say can be checked without a Bridge, run on every change.
#
# It validates no adapter, and that is deliberate. A specification that clones
# the adapters it knows about goes red because of a property missing from
# somebody else's repository, and grows a job per adapter for as long as
# adapters keep being written. The check an adapter needs is published from
# here instead, as .github/actions/validate-adapter, and each adapter's own CI
# calls it at a tag of this repository: the arrow runs from adapter to
# specification, and this repository never learns that any particular adapter
# exists (docs/alignment.md).
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: the specification's own files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: python3 -m pip install --upgrade pip pyshacl rdflib roc-validator

      - name: every Turtle file parses
        run: |
          python3 - <<'PY'
          from rdflib import Graph
          for path in ("vocab/bridge.ttl", "shapes/bridge.shapes.ttl"):
              graph = Graph()
              graph.parse(path, format="turtle")
              print(f"{path}: {len(graph)} triples")
          PY

      - name: the shapes are valid SHACL
        run: python3 -m pyshacl --metashacl --shacl shapes/bridge.shapes.ttl shapes/bridge.shapes.ttl

      - name: the profile crate is a valid RO-Crate 1.2
        run: rocrate-validator validate profile/ --profile-identifier ro-crate-1.2 --no-paging

      # The lint this repository publishes has to run somewhere, or it is
      # published untested. It runs here against a package built to fail: the
      # fixture holds no adapter, so the lint must say so and exit non-zero.
      # A fixture, not an adapter: it names no format, no repository and no
      # real package.
      - name: the published lint reports a package that is not an adapter
        run: |
          set -euo pipefail
          mkdir -p not-an-adapter
          printf '%s\n' 'not a crate' > not-an-adapter/README.md
          if python3 scripts/validate-adapter.py not-an-adapter; then
            echo "the lint accepted a directory holding no ro-crate-metadata.json"
            exit 1
          fi
          echo "the lint refused it, as it must"
