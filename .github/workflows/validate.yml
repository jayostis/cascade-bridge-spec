# This repository's own CI, and all of it. Everything adapter/validation.md and
# CLAUDE.md say can be checked without a Bridge, run on every change.
#
# It validates no real adapter, and that is deliberate. A specification that
# clones the adapters it knows about goes red because of a property missing
# from somebody else's repository, and grows a job per adapter for as long as
# adapters keep being written. The check an adapter needs is published from
# here instead, as .github/actions/validate-adapter, and each adapter's own CI
# calls it at a tag of this repository: the arrow runs from adapter to
# specification, and this repository never learns that any particular adapter
# exists (pinning.md).
#
# The lint still has to be exercised, or it is published untested. The second
# job below runs it against fixtures/synthetic-adapter, a synthetic package
# this repository wrote and owns, and then runs the mutation cases that show
# each check failing. A subject this repository owns is the one way to test a
# published lint without knowing an adapter.
name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: the specification's own files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install
        run: python3 -m pip install --upgrade pip pyshacl rdflib roc-validator

      - name: every Turtle file parses
        run: |
          python3 - <<'PY'
          from glob import glob
          from rdflib import Graph
          lift = sorted(glob("fixtures/lift/*.ttl"))
          lift += sorted(glob("fixtures/lift/*.nt"))
          for path in ["vocab/bridge.ttl", "shapes/bridge.shapes.ttl", *lift]:
              graph = Graph()
              graph.parse(path, format="turtle")
              print(f"{path}: {len(graph)} triples")
          PY

      - name: the shapes are valid SHACL
        run: python3 -m pyshacl --metashacl --shacl shapes/bridge.shapes.ttl shapes/bridge.shapes.ttl

      # Nothing else here judges the lift vectors: this repository runs no
      # Bridge, and parsing alone passes an entry naming a missing file, an
      # entry left out of mf:entries, and a vector no entry names.
      - name: the lift manifest conforms to the shapes and names every vector
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from pyshacl import validate
          from rdflib import Graph, Namespace, RDF, URIRef

          MF = Namespace("http://www.w3.org/2001/sw/DataAccess/tests/test-manifest#")
          BRIDGE = Namespace("https://ns.cascadeprotocol.org/bridge/v1-draft#")
          lift = Path("fixtures/lift").resolve()
          manifest = lift / "manifest.ttl"
          base = lift.as_uri() + "/"

          graph = Graph().parse(manifest, format="turtle", publicID=manifest.as_uri())
          shapes = Graph().parse("shapes/bridge.shapes.ttl", format="turtle")
          conforms, _, text = validate(graph, shacl_graph=shapes, advanced=True)
          problems = [] if conforms else [text]

          listed = set(graph.items(graph.value(URIRef(manifest.as_uri()), MF.entries)))
          named = set()
          for entry in sorted(graph.subjects(RDF.type, BRIDGE.LiftTest)):
              if entry not in listed:
                  problems.append(f"{entry} is not in mf:entries")
              for step, term in ((MF.action, BRIDGE.input), (MF.result, BRIDGE.graph)):
                  for node in graph.objects(entry, step):
                      for iri in graph.objects(node, term):
                          name = str(iri).removeprefix(base)
                          named.add(name)
                          if "/" in name or not (lift / name).is_file():
                              problems.append(f"{entry} names {iri}, not a file in fixtures/lift")
          for path in sorted(lift.iterdir()):
              if path.suffix in (".xml", ".nt") and path.name not in named:
                  problems.append(f"{path.name} is a vector no entry names")

          print("\n".join(problems) or f"{len(listed)} lift test(s), every vector named")
          sys.exit(1 if problems else 0)
          PY

      - name: the profile crate is a valid RO-Crate 1.2
        run: rocrate-validator validate adapter/profile/ --profile-identifier ro-crate-1.2 --no-paging

  lint:
    name: the published lint, on a package of its own
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The action, called by local path, so that what runs here is the file an
      # adapter's CI calls at a tag rather than a copy of the command inside
      # it. Called by path there is no ref to resolve to a SHA, so the fixture
      # package's bridge:specPin is reported and not compared, and the run says
      # which of the two happened.
      - name: the action validates the fixture package
        uses: ./.github/actions/validate-adapter
        with:
          path: fixtures/synthetic-adapter

      # The step above installed python3, pyshacl, rdflib, roc-validator and
      # lxml; the two below reuse them.
      #
      # A lint nobody has seen fail is a lint nobody should trust. Each case
      # copies the fixture package into a temporary directory, breaks exactly
      # one property, and asserts that the lint says so in the words
      # adapter/validation.md fixes -- and that a check which found nothing of its
      # kind is never reported in the same word as one that ran and passed.
      # Nothing tracked is mutated and no mutated copy is written inside the
      # repository.
      - name: the lint can be seen failing
        run: python3 scripts/selftest-lint.py

      # The cheapest negative of all: a directory that is not an adapter
      # package at all. It names no format, no repository and no real package.
      - name: the lint refuses a directory that is not an adapter package
        run: |
          set -euo pipefail
          mkdir -p not-an-adapter
          printf '%s\n' 'not a crate' > not-an-adapter/README.md
          if python3 scripts/validate-adapter.py not-an-adapter; then
            echo "the lint accepted a directory holding no ro-crate-metadata.json"
            exit 1
          fi
          echo "the lint refused it, as it must"
