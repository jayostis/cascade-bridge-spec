# This repository's own CI, and all of it. Everything adapter/validation.md and
# CLAUDE.md say can be checked without a Bridge, run on every change.
#
# It validates no real adapter and runs no real engine, and that is deliberate.
# A specification that clones the adapters it knows about goes red because of a
# property missing from somebody else's repository, and grows a job per adapter
# for as long as adapters keep being written. The checks are published from
# here instead, as actions, and each adapter's and engine's own CI calls the
# starter at a tag that never moves: the arrow runs towards the specification,
# and this repository never learns that any particular adapter or engine
# exists (pinning.md).
#
# The tools still have to be exercised, or they are published untested. The
# jobs below run them against subjects this repository wrote and owns --
# fixtures/synthetic-adapter, fixtures/fake-engine and throwaway repositories
# -- and run the cases that show each check failing. A subject this repository
# owns is the one way to test a published tool without knowing an adapter.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spec:
    name: This repo's spec files are valid (no tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --group validators

      - name: Parse every Turtle file
        run: |
          python3 - <<'PY'
          from glob import glob
          from rdflib import Graph
          lift = sorted(glob("fixtures/lift/*.ttl"))
          lift += sorted(glob("fixtures/lift/*.nt"))
          shapes = sorted(glob("adapter/profile/must/*.ttl"))
          for path in ["vocab/bridge.ttl", "shapes/bridge.shapes.ttl", *shapes, *lift]:
              graph = Graph()
              graph.parse(path, format="turtle")
              print(f"{path}: {len(graph)} triples")
          PY

      - name: Check the SHACL shapes are valid SHACL
        run: |
          for shapes in shapes/bridge.shapes.ttl adapter/profile/must/*.ttl; do
            python3 -m pyshacl --metashacl --shacl "$shapes" "$shapes"
          done

      # Nothing else here judges the lift vectors: this repository runs no
      # Bridge, and parsing alone passes an entry naming a missing file, an
      # entry left out of mf:entries, and a vector no entry names.
      - name: Check the lift test manifest lists every vector
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from pyshacl import validate
          from rdflib import Graph, Namespace, RDF, URIRef

          MF = Namespace("http://www.w3.org/2001/sw/DataAccess/tests/test-manifest#")
          BRIDGE = Namespace("https://ns.cascadeprotocol.org/bridge/v1-draft#")
          lift = Path("fixtures/lift").resolve()
          manifest = lift / "manifest.ttl"
          base = lift.as_uri() + "/"

          graph = Graph().parse(manifest, format="turtle", publicID=manifest.as_uri())
          shapes = Graph().parse("shapes/bridge.shapes.ttl", format="turtle")
          conforms, _, text = validate(graph, shacl_graph=shapes, advanced=True)
          problems = [] if conforms else [text]

          listed = set(graph.items(graph.value(URIRef(manifest.as_uri()), MF.entries)))
          named = set()
          tests = {s for t in (BRIDGE.LiftTest, BRIDGE.SkeletonTest)
                     for s in graph.subjects(RDF.type, t)}
          for entry in sorted(tests):
              if entry not in listed:
                  problems.append(f"{entry} is not in mf:entries")
              for step, term in ((MF.action, BRIDGE.input), (MF.result, BRIDGE.graph)):
                  for node in graph.objects(entry, step):
                      for iri in graph.objects(node, term):
                          name = str(iri).removeprefix(base)
                          named.add(name)
                          if "/" in name or not (lift / name).is_file():
                              problems.append(f"{entry} names {iri}, not a file in fixtures/lift")
          for path in sorted(lift.iterdir()):
              if path.suffix in (".xml", ".nt") and path.name not in named:
                  problems.append(f"{path.name} is a vector no entry names")

          print("\n".join(problems) or f"{len(listed)} lift test(s), every vector named")
          sys.exit(1 if problems else 0)
          PY

      - name: Validate the adapter profile crate against RO-Crate 1.2
        run: rocrate-validator validate adapter/profile/ --profile-identifier ro-crate-1.2 --no-paging

  pytest:
    name: 'pytest: adapter profile checks, unit and end-to-end on a synthetic adapter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --group dev

      - name: Run pytest
        run: python3 -m pytest

  compatibility-selftest:
    name: 'compatibility.py self-test: fake engine and throwaway repos (not pytest)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --group validators

      # Throwaway repositories named by file:// URLs, so no network: each case
      # breaks one rule, or exercises one, and asserts what the tool says.
      - name: Run scripts/selftest-compatibility.py
        run: python3 scripts/selftest-compatibility.py

  actions:
    name: Published GitHub Actions, run on a synthetic adapter (not pytest)
    runs-on: ubuntu-latest
    steps:
      # Under its own name, the way the starter lays siblings out: it hands
      # over to this repository's actions at ./cascade-bridge-spec/.
      - uses: actions/checkout@v4
        with:
          path: cascade-bridge-spec

      # Called by local path, so that what runs here is the file the starter
      # hands over to rather than a copy of the command inside it.
      - name: validate-adapter action on the synthetic adapter
        uses: ./cascade-bridge-spec/.github/actions/validate-adapter
        with:
          path: cascade-bridge-spec/fixtures/synthetic-adapter

      # start-v1 does not exist until it is tagged, so the starter is called by
      # local path. It says so, and runs the tools from this checkout rather
      # than from the fixture's pin, whose revision predates them.
      - name: start action (lint) on the synthetic adapter
        uses: ./cascade-bridge-spec/.github/actions/start
        with:
          path: cascade-bridge-spec/fixtures/synthetic-adapter

      - name: start action (merge gate) on the synthetic adapter
        uses: ./cascade-bridge-spec/.github/actions/start
        with:
          path: cascade-bridge-spec/fixtures/synthetic-adapter
          check: ready-to-merge
