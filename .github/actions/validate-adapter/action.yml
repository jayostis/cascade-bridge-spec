# The Cascade Bridge Specification's adapter lint, published so that no adapter
# carries a copy of the checks.
#
# The direction is the point. This action takes a directory and validates it
# against the contract in this repository; it never learns that any particular
# adapter exists, names none, and clones nothing. The specification publishes
# an artefact and the adapter consumes it, so the arrow runs from adapter to
# specification, which is the direction pinning.md requires.
#
# An adapter's CI reaches it through the starter, .github/actions/start, which
# checks this repository out at the adapter's own bridge:specPin and calls this
# action from that checkout. The revision that runs is the one the crate pins,
# by construction, so there is no second statement of the pin to compare.
#
# All seven checks of adapter/validation.md run, and the run ends by giving
# each of them the word it earned: `ok`, `FAIL`, `nothing to check` or `not
# run`. A check whose tool is absent, and a check that found nothing of its
# kind in the package, are never reported in the same word as a check that ran
# and passed. Nothing an adapter names is fetched, and the action needs no
# credentials.
name: Validate a Cascade Bridge Adapter
description: >-
  Validate an adapter package against the Cascade Bridge Specification: all
  seven checks of adapter/validation.md -- RO-Crate 1.2, the SHACL shapes over
  the crate and the test manifest as one graph, the file inventory, the digests,
  every input against the schema its envelope declares, every expected graph as
  Turtle, and every query as SPARQL 1.1. Each check reports whether it ran.

inputs:
  path:
    description: >-
      Path to the adapter package, relative to the workspace. The package root
      is the directory holding ro-crate-metadata.json.
    required: false
    default: '.'
  python-version:
    description: The Python the checks run on.
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: install the validators
      shell: bash
      run: python3 -m pip install --upgrade pip pyshacl rdflib roc-validator lxml

    - name: validate the adapter package
      shell: bash
      env:
        ADAPTER_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        spec_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        python3 "${spec_root}/scripts/validate-adapter.py" "${ADAPTER_PATH}"
