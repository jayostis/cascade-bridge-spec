name: Validate a Cascade Bridge Adapter
description: >-
  Validate an adapter package against the cascade-bridge-adapter RO-Crate
  profile, adapter/profile/.

inputs:
  path:
    description: >-
      Path to the adapter package, relative to the workspace. The package root
      is the directory holding ro-crate-metadata.json.
    required: false
    default: '.'
  python-version:
    description: The Python the checks run on.
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: install the validators
      shell: bash
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install --group "${{ github.action_path }}/../../../pyproject.toml:validators"

    - name: validate the adapter package
      shell: bash
      env:
        ADAPTER_PATH: ${{ inputs.path }}
      run: |
        set -euo pipefail
        spec_root="$(cd "${{ github.action_path }}/../../.." && pwd)"
        rocrate-validator validate "${ADAPTER_PATH}" \
          --extra-profiles-path "${spec_root}/adapter" \
          --profile-identifier cascade-bridge-adapter --no-paging --verbose
