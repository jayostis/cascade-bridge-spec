# start-v2 holds no rule: it fetches this repository's default branch and runs
# the entry point there. Only the names it relies on are frozen -- the entry
# point's path, its arguments, and the directory it keeps as artifacts.
name: Cascade Bridge start
description: >-
  Run the Cascade Bridge Specification's checks on the repository: the adapter
  lint where it holds a crate, then its compatibility.json's counterparts, or
  the merge gate. Which version of every repository the run uses is picked
  when it runs.

inputs:
  path:
    description: >-
      The repository under test, relative to the workspace: a directory named
      as its repository, so that counterparts can be checked out beside it.
      When it is not there, the calling repository is checked out into it.
    required: false
    default: ${{ github.event.repository.name }}
  check:
    description: >-
      compatibility: the adapter lint when the repository holds a crate, then
      its compatibility.json's counterparts. ready-to-merge: the merge gate,
      meant to be a required status check.
    required: false
    default: compatibility
  python-version:
    description: The Python the tooling runs on.
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - name: is the repository under test checked out
      id: present
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        CHECK: ${{ inputs.check }}
      run: |
        set -euo pipefail
        case "${CHECK}" in
          compatibility|ready-to-merge) ;;
          *) echo "::error::check is compatibility or ready-to-merge, not ${CHECK}"; exit 1 ;;
        esac
        if [ -d "${REPOSITORY_PATH}" ]; then echo "present=true"; else echo "present=false"; fi >> "$GITHUB_OUTPUT"

    - if: steps.present.outputs.present != 'true'
      uses: actions/checkout@v7
      with:
        path: ${{ inputs.path }}

    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: the specification's default branch, to run the entry point from
      id: specification
      shell: bash
      env:
        ACTION_REPOSITORY: ${{ github.action_repository }}
        SERVER_URL: ${{ github.server_url }}
      run: |
        set -euo pipefail
        own="$(cd "${{ github.action_path }}/../../.." && pwd)"
        if [ -z "${ACTION_REPOSITORY}" ]; then
          echo "called by local path: the entry point runs from ${own}"
          echo "entry-point=${own}/scripts/compatibility.py" >> "$GITHUB_OUTPUT"
          echo "repository=${SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        repository="${SERVER_URL}/${ACTION_REPOSITORY}"
        bootstrap="${RUNNER_TEMP}/cascade-bridge-spec-bootstrap"
        rm -rf "${bootstrap}"
        git init --quiet "${bootstrap}"
        branch="$(git ls-remote --symref "${repository}" HEAD | sed -n 's|^ref: refs/heads/||p' | cut -f1)"
        git -C "${bootstrap}" fetch --quiet --depth 1 "${repository}" "refs/heads/${branch}"
        git -C "${bootstrap}" checkout --quiet --detach FETCH_HEAD
        echo "${repository} ${branch} is $(git -C "${bootstrap}" rev-parse HEAD), at ${bootstrap}"
        echo "entry-point=${bootstrap}/scripts/compatibility.py" >> "$GITHUB_OUTPUT"
        echo "repository=${repository}" >> "$GITHUB_OUTPUT"

    - name: run the check
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        CHECK: ${{ inputs.check }}
        ENTRY_POINT: ${{ steps.specification.outputs.entry-point }}
        SPEC_REPOSITORY: ${{ steps.specification.outputs.repository }}
        RESULTS: ${{ runner.temp }}/compatibility-${{ inputs.check }}
        # A composite action's steps inherit no token; the table is commented with this one.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        python3 "${ENTRY_POINT}" "${REPOSITORY_PATH}" \
          --check "${CHECK}" \
          --results "${RESULTS}" \
          --spec-repository "${SPEC_REPOSITORY}"

    # An upload refuses a name another leg has taken: matrix legs share
    # github.job, and one job may start both checks.
    - name: name the results for this leg
      id: artifact
      if: always()
      shell: bash
      env:
        JOB: ${{ github.job }}
        CHECK: ${{ inputs.check }}
      run: echo "name=${CHECK}-${JOB}-${RANDOM}${RANDOM}" >> "$GITHUB_OUTPUT"

    - name: keep the record and the EARL reports
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: ${{ runner.temp }}/compatibility-${{ inputs.check }}
        if-no-files-found: ignore
