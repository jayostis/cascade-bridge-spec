name: Cascade Bridge performance
description: >-
  Time the Bridge's benchmark inputs on the repository under test, write the
  result file of bench/result.schema.json, and either keep it on the
  repository's perf-data branch (a push to the default branch, a nightly or a
  manual run) or comment its comparison with the newest main run on the pull
  request. Nothing is thresholded, and a slow run is no failure. The caller
  checks the repository out, runs the specification's start action with
  checkout-only, and calls this action by its local path, so that the
  specification it runs is the one a Depends-On: line picks.

inputs:
  path:
    description: >-
      The repository under test, relative to the workspace: a directory named as
      its repository, with its counterparts checked out beside it.
    required: false
    default: ${{ github.event.repository.name }}
  inputs:
    description: 'pull-requests: the inputs marked onPullRequests. all: every input.'
    required: false
    default: pull-requests
  samples:
    description: How many fresh processes time each input.
    required: false
    default: '3'
  publish:
    description: >-
      'true': keep the file on the perf-data branch of the repository (the job
      needs contents: write). 'false': comment on the pull request (the job
      needs pull-requests: write).
    required: false
    default: 'false'
  reference:
    description: >-
      'true': in place of the timing, convert each input once under the default
      executor and once under the reference executor, and report whether their
      output digests are the same. With publish 'true' the file and the verdict
      are kept under bridge-reference/ on the perf-data branch. Run it as a job
      of its own: the reference executor is far slower than the default.
    required: false
    default: 'false'
  reference-max-bytes:
    description: >-
      With reference 'true': an input of more bytes than this is left out of
      both runs, and the verdict lists them.
    required: false
    default: '5000000'
  token:
    description: The token every call of gh and every push is made with.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 22

    - name: the package the Bridge's build release holds
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
        PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "${GITHUB_ACTION_PATH}/perf.sh" package

    - name: the packages of the Bridge's node host
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: bash "${GITHUB_ACTION_PATH}/perf.sh" packages

    - name: time the inputs
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
        WHICH: ${{ inputs.inputs }}
        SAMPLES: ${{ inputs.samples }}
        REFERENCE: ${{ inputs.reference }}
        REFERENCE_MAX_BYTES: ${{ inputs.reference-max-bytes }}
        RUNNER_ENVIRONMENT: ${{ runner.environment }}
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      run: bash "${GITHUB_ACTION_PATH}/perf.sh" run

    - name: the job summary
      if: always()
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
        WHICH: ${{ inputs.inputs }}
        REFERENCE: ${{ inputs.reference }}
        REFERENCE_MAX_BYTES: ${{ inputs.reference-max-bytes }}
      run: |
        [ -f "${OUT}/package.md" ] || exit 0
        bash "${GITHUB_ACTION_PATH}/perf.sh" summary

    - name: keep the file on the perf-data branch
      if: inputs.publish == 'true'
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
        REFERENCE: ${{ inputs.reference }}
        REFERENCE_MAX_BYTES: ${{ inputs.reference-max-bytes }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "${GITHUB_ACTION_PATH}/perf.sh" publish

    - name: the history page's data
      if: inputs.publish == 'true' && inputs.reference != 'true'
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
      run: bash "${GITHUB_ACTION_PATH}/perf.sh" export

    - name: the history page
      if: inputs.publish == 'true' && inputs.reference != 'true'
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: Bridge performance
        tool: customSmallerIsBetter
        output-file-path: ${{ runner.temp }}/perf/history.json
        gh-pages-branch: perf-data
        gh-repository: github.com/${{ github.repository }}
        benchmark-data-dir-path: history
        github-token: ${{ inputs.token }}
        auto-push: true
        ref: ${{ github.sha }}
        max-items-in-chart: 400
        comment-always: false
        comment-on-alert: false
        summary-always: false
        fail-on-alert: false

    - name: comment the comparison with main
      if: inputs.publish != 'true' && inputs.reference != 'true' && github.event.pull_request.number
      shell: bash
      env:
        REPOSITORY_PATH: ${{ inputs.path }}
        OUT: ${{ runner.temp }}/perf
        SPECIFICATION: ${{ github.action_path }}/../../..
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        PULL_REQUEST_HEAD: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        [ -f "${OUT}/default/run.json" ] || exit 0
        bash "${GITHUB_ACTION_PATH}/perf.sh" comment

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: perf-${{ github.job }}
        path: ${{ runner.temp }}/perf
        if-no-files-found: ignore
